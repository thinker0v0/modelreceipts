name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        cross-check: [stdlib-only, with-dev-deps]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional cross-check dependencies
        if: matrix.cross-check == 'with-dev-deps'
        run: python -m pip install -r requirements-dev.txt
      - name: Collector tests
        run: python -m unittest discover -s collector/tests -v
      - name: Server tests
        run: python -m unittest discover -s server/tests -v
      - name: Seed tests
        run: python -m unittest discover -s seeds/tests -v
      - name: Validate schema examples (v0.1, v0.2, seed cells)
        run: |
          PYTHONPATH=collector python -m modelreceipts validate schema/examples/*.json schema/examples/v0.1/*.json
          PYTHONPATH=collector python -m modelreceipts validate --allow-seed-cells schema/examples/seed-cells/*.json
      - name: Packaged schemas match schema/
        run: |
          for f in schema/*.schema.json; do cmp "$f" "collector/modelreceipts/schemas/$(basename "$f")"; done
      - name: Validate every seed record and cell
        run: |
          PYTHONPATH=seeds python -m modelreceipts_seeds aider-polyglot
          PYTHONPATH=seeds python -m modelreceipts_seeds arena-55k
          PYTHONPATH=seeds python -m modelreceipts_seeds openrouter
      - name: Classifier eval report is up to date
        run: |
          PYTHONPATH=collector python -m modelreceipts eval-classifier --markdown > /tmp/RESULTS.md
          diff -u collector/eval/RESULTS.md /tmp/RESULTS.md
      - name: Samples and demo figure are up to date
        run: |
          PYTHONPATH=server python -m modelreceipts_server make-sample --out-dir /tmp/sample --figure /tmp/sample/figure.svg
          diff -u dashboard/data/aggregates.sample.json /tmp/sample/aggregates.sample.json
          diff -u dashboard/data/overview.sample.json /tmp/sample/overview.sample.json
          diff -u docs/figures/self-vs-evidence.synthetic.svg /tmp/sample/figure.svg
